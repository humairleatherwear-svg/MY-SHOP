<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Stitch – Bags, Jackets & Hoodies</title>
<meta name="description" content="Urban Stitch: shop bags, jackets, hoodies and more. Quality streetwear delivered to your door.">
<meta property="og:title" content="Urban Stitch – Bags, Jackets & Hoodies">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--brand:#111;--accent:#b8893b;--card:#fff;--cols:4;--hero:70vh;--radius:4px;--font:'Inter',system-ui,sans-serif;--head:'Poppins','Inter',sans-serif;--line:color-mix(in srgb,var(--ink) 11%,transparent);--muted:color-mix(in srgb,var(--ink) 55%,transparent);--soft:color-mix(in srgb,var(--ink) 5%,var(--bg))}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:var(--head);font-weight:600;letter-spacing:-.02em}
.top{background:var(--soft);color:var(--muted);text-align:center;font-size:.8rem;padding:8px 5%}
.top[hidden]{display:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 5%;background:var(--bg);color:var(--ink);position:sticky;top:0;z-index:20;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.logo{font-size:1.3rem;color:var(--ink);text-decoration:none}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav button,.btn{font:inherit;cursor:pointer;border:0;border-radius:var(--radius);padding:9px 18px;background:transparent;color:inherit;transition:background .2s,color .2s}
nav button{padding:4px 0;border-radius:0;color:var(--muted);font-size:.92rem;border-bottom:2px solid transparent}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);font-weight:500}
.btn:hover{opacity:.85}
.btn.alt{background:#e9e9e9;color:#111}
.btn.red{background:#c0392b;color:#fff}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.slider{position:relative;height:var(--hero);min-height:380px;overflow:hidden;background:#222}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;display:flex;align-items:center;padding:0 8%;color:#fff;background-size:cover;background-position:center;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.05) 70%)}
.slide div{position:relative;max-width:520px}
.slide h1{font-size:clamp(2rem,5.5vw,3.8rem);line-height:1.08;margin-bottom:12px}
.slide p{margin-bottom:26px;font-size:1.05rem;color:#ffffffe6;max-width:420px}
.slide .btn{background:#fff;color:#111;padding:13px 28px}
.dots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:7px;height:7px;border-radius:99px;background:#fff7;cursor:pointer;transition:width .25s,background .25s}
.dots i.on{background:#fff;width:24px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:#fff;color:#111;border:0;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.2rem;opacity:.9}
.arrow:hover{opacity:1}
.arrow.l{left:16px}.arrow.r{right:16px}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-bottom:1px solid var(--line)}
.trust div{padding:20px 5%;font-size:.88rem;text-align:center}
.trust b{display:block;font-weight:600}
.trust span{color:var(--muted)}
main{padding:56px 5% 72px;max-width:1360px;margin:0 auto}
main h2{font-size:1.6rem;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:34px 22px}
.card{background:var(--card);display:flex;flex-direction:column}
.card .img{aspect-ratio:4/5;background:var(--soft) center/cover;border-radius:var(--radius);display:grid;place-items:center;font-family:var(--head);font-size:3.5rem;font-weight:600;color:var(--line)}
.card .b{padding:14px 2px 0;display:flex;flex-direction:column;gap:3px;flex:1}
.card small{color:var(--muted);font-size:.78rem}
.card h3{font-size:1rem;font-weight:500;letter-spacing:0}
.card p{color:var(--muted);font-size:.88rem}
.price{font-weight:600;font-size:1rem;margin-top:4px}
.card a.btn{margin-top:14px;text-align:center;text-decoration:none;display:block;background:transparent;color:var(--ink);border:1px solid var(--ink);padding:10px}
.card a.btn:hover{background:var(--ink);color:var(--bg);opacity:1}
.cats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:44px}
.cat{background:transparent;color:var(--ink);border-radius:99px;padding:10px 24px;cursor:pointer;font:inherit;font-weight:500;border:1px solid var(--line);transition:background .2s,color .2s,border-color .2s}
.cat:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{grid-column:1/-1;padding:48px 0;text-align:center;color:var(--muted)}
footer{background:var(--soft);color:var(--muted);padding:40px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;border-top:1px solid var(--line)}
footer strong{font-family:var(--head);font-weight:600;font-size:1.15rem;color:var(--ink)}
footer p{max-width:340px;margin-top:6px;font-size:.9rem}
#contact{font-size:.9rem;max-width:360px}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:none;overflow:auto;padding:20px}
.modal.on{display:block}
.panel{background:#fff;color:#14201f;max-width:880px;margin:0 auto;border-radius:8px;padding:20px}
.panel h3{margin:18px 0 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{padding:8px 12px;border:0;border-radius:6px;background:#e9e9e9;cursor:pointer;font:inherit}
.tabs button.on{background:#111;color:#fff}
label{display:block;font-size:.85rem;margin:8px 0 2px;color:#456}
input,select,textarea{width:100%;padding:8px;border:1px solid #bcc5c0;border-radius:6px;font:inherit}
input[type=color]{padding:2px;height:38px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.item{border:1px solid #d5dbd7;border-radius:6px;padding:10px;margin:8px 0}
.item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
@media(max-width:900px){:root{--cols:2!important}.grid{gap:26px 12px}main{padding:36px 5% 56px}}
@media(max-width:520px){header{justify-content:center}nav{gap:16px}.slide{padding:0 6%}}
@media(prefers-reduced-motion:reduce){.slide,.dots i{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="top" id="announce"></div>
<header>
  <a class="logo" href="#" id="logo">Urban Stitch</a>
  <nav id="nav"></nav>
</header>
<section class="slider" id="slider" aria-label="Featured"></section>
<div class="trust"><div><b>Order on WhatsApp</b><span>Pick a product, send one message</span></div><div><b>Delivered to your door</b><span>Quality streetwear, shipped to you</span></div><div><b>Quality checked</b><span>Bags, jackets and hoodies</span></div></div>
<main>
  <div class="cats" id="cats"></div>
  <h2 id="ptitle">All products</h2>
  <div class="grid" id="grid"></div>
</main>
<footer>
  <div><strong id="fname"></strong><p>Quality bags, jackets and hoodies. Order on WhatsApp and we deliver to your door.</p></div>
  <div id="contact"></div>
</footer>

<div class="modal" id="modal"><div class="panel" id="panel"></div></div>

<script>
/* ---------- Default data (admin se badal sakte hain) ---------- */
const DEFAULT={
 settings:{name:"Urban Stitch",whatsapp:"923000000000",contact:"WhatsApp: 0300 0000000 · Email: shop@example.com",
  brand:"#111111",accent:"#b8893b",bg:"#ffffff",ink:"#111111",cols:4,hero:70,radius:4,
  headFont:"Poppins",bodyFont:"Inter",interval:5,currency:"Rs.",announce:"Order on WhatsApp in one message"},
 categories:["Bags","Jackets","Hoodies"],
 slides:[
  {type:"image",src:"",bg:"#0f3d3e",title:"Winter hoodies are here",text:"Warm, soft and made to last.",btn:"Shop hoodies",cat:"Hoodies"},
  {type:"image",src:"",bg:"#7a3b1d",title:"Jackets for every day",text:"Leather, denim and puffer styles.",btn:"Shop jackets",cat:"Jackets"},
  {type:"image",src:"",bg:"#2c3e66",title:"Carry it your way",text:"Backpacks, totes and travel bags.",btn:"Shop bags",cat:"Bags"}],
 products:[
  {id:1,name:"Classic Black Hoodie",cat:"Hoodies",price:3200,img:"",desc:"Fleece lined pullover hoodie."},
  {id:2,name:"Zip Hoodie Grey",cat:"Hoodies",price:3600,img:"",desc:"Full zip, two pockets."},
  {id:3,name:"Denim Jacket",cat:"Jackets",price:5500,img:"",desc:"Washed blue denim jacket."},
  {id:4,name:"Puffer Jacket",cat:"Jackets",price:7200,img:"",desc:"Water resistant, very warm."},
  {id:5,name:"Travel Backpack",cat:"Bags",price:4200,img:"",desc:"30L with laptop sleeve."},
  {id:6,name:"Canvas Tote",cat:"Bags",price:1800,img:"",desc:"Strong everyday tote."}]
};
let D=null,cur="All",admin=false,idx=0,timer;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(){
  try{const r=await fetch("/api/data",{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&j.settings)D=j}}catch(e){}
  if(!D)D=JSON.parse(JSON.stringify(DEFAULT));
  render();
}
let dirty=false;
function save(){dirty=true;render();const b=$("#pub");if(b)b.textContent="Publish changes *"}
async function publish(){
  const b=$("#pub");b.disabled=true;b.textContent="Publishing...";
  try{const r=await fetch("/api/data",{method:"PUT",headers:{"content-type":"application/json","x-admin-password":PW},body:JSON.stringify(D)});
    if(r.ok){dirty=false;b.textContent="Published ✓"}else{b.textContent="Failed ("+r.status+")";if(r.status==401){admin=false;PW="";alert("Session expired. Login again.");close()}}}
  catch(e){b.textContent="Network error"}
  b.disabled=false;setTimeout(()=>{if($("#pub"))$("#pub").textContent=dirty?"Publish changes *":"Publish changes"},2500);
}
function theme(){
  const s=D.settings,r=document.documentElement.style;
  r.setProperty("--brand",s.brand);r.setProperty("--accent",s.accent);r.setProperty("--bg",s.bg);r.setProperty("--ink",s.ink);
  r.setProperty("--cols",s.cols);r.setProperty("--hero",s.hero+"vh");r.setProperty("--radius",s.radius+"px");
  r.setProperty("--head",`'${s.headFont}',Impact,sans-serif`);r.setProperty("--font",`'${s.bodyFont}',system-ui,sans-serif`);
  const f=[s.headFont,s.bodyFont].filter((v,i,a)=>a.indexOf(v)==i).map(x=>"family="+x.replace(/ /g,"+")+(["Archivo Black","Bebas Neue"].includes(x)?"":":wght@400;500;600")).join("&");
  let l=$("#gf");if(!l){l=document.createElement("link");l.id="gf";l.rel="stylesheet";document.head.appendChild(l)}
  l.href="https://fonts.googleapis.com/css2?"+f+"&display=swap";
  $("#logo").textContent=s.name;$("#fname").textContent=s.name;const an=$("#announce");an.textContent=s.announce??"Order on WhatsApp in one message";an.hidden=!an.textContent;document.title=s.name+" – "+D.categories.join(", ");
}
function render(){
  theme();
  const s=D.settings;
  $("#nav").innerHTML=["All",...D.categories].map(c=>`<button class="${c==cur?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#cats").innerHTML=D.categories.map(c=>`<button class="cat" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const list=D.products.filter(p=>cur=="All"||p.cat==cur);
  $("#ptitle").textContent=cur=="All"?"All products":cur;
  $("#grid").innerHTML=list.length?list.map(p=>{
    const msg=encodeURIComponent(`Hi, I want to order: ${p.name} (${s.currency} ${p.price})`);
    return `<article class="card"><div class="img" style="${p.img?`background-image:url('${esc(p.img)}')`:''}">${p.img?'':esc((p.name||'?').charAt(0).toUpperCase())}</div><div class="b"><small>${esc(p.cat)}</small><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="price">${+p.price?esc(s.currency)+" "+(+p.price).toLocaleString("en-PK"):"Message for price"}</div><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(s.whatsapp)}?text=${msg}">Order on WhatsApp</a></div></article>`}).join(""):"<p class=\"empty\">No products in this category yet.</p>";
  $("#contact").textContent=s.contact;
  slider();
}
function slider(){
  const sl=D.slides,el=$("#slider");clearInterval(timer);
  if(idx>=sl.length)idx=0;
  el.innerHTML=sl.map((x,i)=>`<div class="slide ${i==idx?'on':''}" style="${x.type=='image'?(x.src?`background-image:url('${esc(x.src)}')`:`background:${esc(x.bg||'#0f3d3e')}`):'background:#000'}">${x.type=='video'&&x.src?`<video src="${esc(x.src)}" autoplay muted loop playsinline></video>`:''}<div><h1>${esc(x.title)}</h1><p>${esc(x.text)}</p>${x.btn?`<button class="btn" data-go="${esc(x.cat||'All')}">${esc(x.btn)}</button>`:''}</div></div>`).join("")
   +`<button class="arrow l" aria-label="Previous">‹</button><button class="arrow r" aria-label="Next">›</button><div class="dots">${sl.map((_,i)=>`<i class="${i==idx?'on':''}" data-i="${i}"></i>`).join("")}</div>`;
  if(sl.length>1)timer=setInterval(()=>go(idx+1),(D.settings.interval||5)*1000);
}
function go(n){const sl=D.slides;idx=(n+sl.length)%sl.length;
  document.querySelectorAll(".slide").forEach((e,i)=>e.classList.toggle("on",i==idx));
  document.querySelectorAll(".dots i").forEach((e,i)=>e.classList.toggle("on",i==idx));}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.c!==undefined){cur=t.dataset.c;render();$("#ptitle").scrollIntoView({behavior:"smooth"})}
  if(t.dataset.go!==undefined){cur=t.dataset.go;render();$("#ptitle").scrollIntoView({behavior:"smooth"})}
  if(t.dataset.i!==undefined)go(+t.dataset.i);
  if(t.classList.contains("arrow"))go(idx+(t.classList.contains("r")?1:-1));
});

/* ---------- Admin ---------- */
let PW="";
function openAdmin(){if(location.hash!=="#admin")return;$("#modal").classList.add("on");admin?panel("settings"):login()}
addEventListener("hashchange",openAdmin);addEventListener("load",openAdmin);
function close(){$("#modal").classList.remove("on");history.replaceState(null,"",location.pathname)}
function login(){
  $("#panel").innerHTML=`<h3>Admin login</h3><label>Password</label><input type="password" id="pw" autocomplete="current-password"><p style="margin-top:12px"><button class="btn" id="ok">Login</button> <button class="btn alt" id="cl">Cancel</button></p><p id="err" style="color:#c0392b"></p>`;
  $("#cl").onclick=close;
  const go=async()=>{const v=$("#pw").value;$("#ok").disabled=true;
    try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:v})});
      if(r.ok){PW=v;admin=true;panel("settings");return}
      $("#err").textContent=r.status==404?"Backend not set up yet (see setup steps).":"Wrong password."}
    catch(e){$("#err").textContent="Cannot reach server."}
    $("#ok").disabled=false};
  $("#ok").onclick=go;$("#pw").onkeydown=e=>{if(e.key=="Enter")go()};$("#pw").focus();
}
function shrink(file,cb,m=1000){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(file)}
const TABS=[["settings","Settings"],["theme","Theme & layout"],["slides","Slides"],["cats","Categories"],["products","Products"],["data","Save / Publish"]];
function panel(tab){
  const s=D.settings;let h=`<div style="display:flex;justify-content:space-between"><h3 style="margin:0">Admin panel</h3><div><button class="btn" id="pub">Publish changes</button> <button class="btn alt" id="lo">Logout</button> <button class="btn" id="x">Close</button></div></div><div class="tabs">${TABS.map(t=>`<button class="${t[0]==tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>`;
  const inp=(l,k,type="text")=>`<div><label>${l}</label><input type="${type}" data-s="${k}" value="${esc(s[k])}"></div>`;
  if(tab=="settings")h+=`<div class="row">${inp("Shop name","name")}${inp("WhatsApp number (92300...)","whatsapp")}${inp("Currency","currency")}${inp("Footer contact text","contact")}${inp("Top banner text (empty = hide)","announce")}</div><p style="margin-top:14px;color:#456">To change the admin password, update ADMIN_PASSWORD in Cloudflare (Settings → Variables and Secrets).</p>`;
  if(tab=="theme")h+=`<div class="row">${inp("Main color","brand","color")}${inp("Accent color","accent","color")}${inp("Background","bg","color")}${inp("Text color","ink","color")}${inp("Products per row (desktop)","cols","number")}${inp("Slider height (vh)","hero","number")}${inp("Corner roundness (px)","radius","number")}${inp("Slide time (seconds)","interval","number")}
   <div><label>Heading font</label><select data-s="headFont">${["Archivo Black","Bebas Neue","Playfair Display","Oswald","Poppins","Rubik"].map(f=>`<option ${f==s.headFont?'selected':''}>${f}</option>`).join("")}</select></div>
   <div><label>Body font</label><select data-s="bodyFont">${["Inter","Poppins","Roboto","Lato","Nunito"].map(f=>`<option ${f==s.bodyFont?'selected':''}>${f}</option>`).join("")}</select></div></div>
   <h3>Quick themes</h3><p>${[["Minimal white","#111111","#b8893b","#ffffff"],["Teal & gold","#0f3d3e","#f2a900","#f6f7f4"],["Midnight","#111827","#38bdf8","#f3f4f6"],["Rose","#7f1d3a","#fb7185","#fff5f6"],["Forest","#1f3d2b","#a3e635","#f4f7f2"]].map(t=>`<button class="btn alt" data-th="${t.slice(1)}">${t[0]}</button>`).join(" ")}</p>`;
  if(tab=="slides"){h+=D.slides.map((x,i)=>`<div class="item"><div class="row">
    <div><label>Type</label><select data-sl="${i}.type"><option ${x.type=='image'?'selected':''}>image</option><option ${x.type=='video'?'selected':''}>video</option></select></div>
    <div><label>Image or video link (mp4)</label><input data-sl="${i}.src" value="${x.src&&x.src.startsWith('data:')?'':esc(x.src)}" placeholder="${x.src&&x.src.startsWith('data:')?'Uploaded photo':''}"><input type="file" accept="image/*" data-fs="${i}"></div>
    <div><label>Fallback color</label><input type="color" data-sl="${i}.bg" value="${esc(x.bg||'#0f3d3e')}"></div>
    <div><label>Title</label><input data-sl="${i}.title" value="${esc(x.title)}"></div>
    <div><label>Text</label><input data-sl="${i}.text" value="${esc(x.text)}"></div>
    <div><label>Button text</label><input data-sl="${i}.btn" value="${esc(x.btn)}"></div>
    <div><label>Button opens category</label><select data-sl="${i}.cat">${["All",...D.categories].map(c=>`<option ${c==x.cat?'selected':''}>${esc(c)}</option>`).join("")}</select></div></div>
    <div class="acts"><button class="btn alt" data-up="${i}">↑</button><button class="btn alt" data-dn="${i}">↓</button><button class="btn red" data-ds="${i}">Delete</button></div></div>`).join("")+`<button class="btn" id="as">+ Add slide</button>`;}
  if(tab=="cats")h+=D.categories.map((c,i)=>`<div class="item row"><input data-cat="${i}" value="${esc(c)}"><div class="acts"><button class="btn red" data-dc="${i}">Delete</button></div></div>`).join("")+`<p><button class="btn" id="ac">+ Add category</button></p>`;
  if(tab=="products"){h+=D.products.map((p,i)=>`<div class="item"><div class="row">
    <div><label>Name</label><input data-p="${i}.name" value="${esc(p.name)}"></div>
    <div><label>Category</label><select data-p="${i}.cat">${D.categories.map(c=>`<option ${c==p.cat?'selected':''}>${esc(c)}</option>`).join("")}</select></div>
    <div><label>Price</label><input type="number" data-p="${i}.price" value="${esc(p.price)}"></div>
    <div><label>Image (link or upload)</label><input data-p="${i}.img" value="${p.img&&p.img.startsWith('data:')?'':esc(p.img)}" placeholder="${p.img&&p.img.startsWith('data:')?'Uploaded photo':''}"><input type="file" accept="image/*" data-fp="${i}"></div>
    <div><label>Description</label><input data-p="${i}.desc" value="${esc(p.desc)}"></div></div>
    <div class="acts"><button class="btn red" data-dp="${i}">Delete</button></div></div>`).join("")+`<button class="btn" id="ap">+ Add product</button>`;}
  if(tab=="data")h+=`<p>Edit anything, then press <b>Publish changes</b> (top). It goes live for all visitors immediately.</p><p><button class="btn alt" id="dl">Download backup (JSON)</button></p><label>Restore from backup</label><input type="file" id="imp" accept=".json"><p style="margin-top:14px"><button class="btn red" id="rs">Reset to default</button></p>`;
  $("#panel").innerHTML=h;
  $("#x").onclick=close;$("#lo").onclick=()=>{admin=false;close()};
  const rp=()=>panel(tab);
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on("#pub",publish);
  on("#as",()=>{D.slides.push({type:"image",src:"",bg:"#333333",title:"New slide",text:"",btn:"",cat:"All"});save();rp()});
  on("#ac",()=>{D.categories.push("New category");save();rp()});
  on("#ap",()=>{D.products.unshift({id:Date.now(),name:"New product",cat:D.categories[0]||"",price:0,img:"",desc:""});save();rp()});
  on("#dl",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download="site-data.json";a.click()});
  on("#rs",()=>{if(confirm("Reset everything?")){D=JSON.parse(JSON.stringify(DEFAULT));save();rp()}});
  const imp=$("#imp");if(imp)imp.onchange=e=>{const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();rp()}catch(x){alert("Invalid file")}};r.readAsText(e.target.files[0])};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>panel(b.dataset.t));
  document.querySelectorAll("[data-s]").forEach(i=>i.oninput=()=>{D.settings[i.dataset.s]=i.type=="number"?+i.value:i.value;save()});
  document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{const[a,c,d]=b.dataset.th.split(",");Object.assign(D.settings,{brand:a,accent:c,bg:d});save();rp()});
  const bind=(sel,arr)=>document.querySelectorAll(`[data-${sel}]`).forEach(i=>{const f=()=>{const[n,k]=i.dataset[sel].split(".");D[arr][n][k]=i.type=="number"?+i.value:i.value;save()};i.oninput=f;i.onchange=f});
  bind("sl","slides");bind("p","products");
  document.querySelectorAll("[data-cat]").forEach(i=>i.onchange=()=>{const o=D.categories[i.dataset.cat];D.categories[i.dataset.cat]=i.value;D.products.forEach(p=>{if(p.cat==o)p.cat=i.value});D.slides.forEach(p=>{if(p.cat==o)p.cat=i.value});save()});
  document.querySelectorAll("[data-fp]").forEach(f=>f.onchange=()=>f.files[0]&&shrink(f.files[0],u=>{D.products[+f.dataset.fp].img=u;save();rp()}));
  document.querySelectorAll("[data-fs]").forEach(f=>f.onchange=()=>f.files[0]&&shrink(f.files[0],u=>{const x=D.slides[+f.dataset.fs];x.type="image";x.src=u;save();rp()},1920));
  const del=(a,arr)=>document.querySelectorAll(`[data-${a}]`).forEach(b=>b.onclick=()=>{D[arr].splice(+b.dataset[a],1);save();rp()});
  del("ds","slides");del("dc","categories");del("dp","products");
  const mv=(a,d)=>document.querySelectorAll(`[data-${a}]`).forEach(b=>b.onclick=()=>{const i=+b.dataset[a],j=i+d;if(j<0||j>=D.slides.length)return;[D.slides[i],D.slides[j]]=[D.slides[j],D.slides[i]];save();rp()});
  mv("up",-1);mv("dn",1);
}
load();
</script>
</body>
</html>
